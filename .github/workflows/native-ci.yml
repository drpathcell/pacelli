name: Native CI

# CI for the native SwiftUI app (PacelliApp/). The crypto vector gate is the
# non-negotiable job: PacelliKit must decrypt the Dart/TS cross-language
# vectors in functions/tests/cross-language/ on every change.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'PacelliApp/**'
      - 'functions/src/**'
      - 'functions/tests/**'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'functions/tsconfig.json'
      - 'scripts/verify_entitlements.py'
      - 'scripts/verify_api_wire.py'
      - '.github/workflows/native-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'PacelliApp/**'
      - 'functions/src/**'
      - 'functions/tests/**'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'functions/tsconfig.json'
      - 'scripts/verify_entitlements.py'
      - 'scripts/verify_api_wire.py'
      - '.github/workflows/native-ci.yml'

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, no toolchain, fails in seconds. The notification extension holds
  # the household key; Phase C justified that on its reach being minimal, and
  # this is what keeps that true after everyone has forgotten the argument.
  entitlements:
    name: Entitlement allow-list (extension reach)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: verify_entitlements
        run: python3 scripts/verify_entitlements.py

  # The other half of the entitlements argument: that job keeps the extension's
  # reach honest, this one keeps the two WRITERS honest. Both are greps, both
  # run in seconds, and both exist because the failure they prevent is silent —
  # a disagreeing writer returns 200 and shows the user nothing.
  #
  # This guard was written on 2026-08-14 and left unwired for its first day,
  # which is why `plans.ts` kept encrypting `quantity` while the app wrote it
  # raw with nothing complaining.
  wire-contract:
    name: API/app wire contract (id fields, quantity encryption)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: verify_api_wire
        run: python3 scripts/verify_api_wire.py

  # The functions/ jest suite had never run in CI — not in this workflow, which
  # had no node job at all, and not in ci.yml, whose `npm test` is the Firestore
  # rules suite in firestore-tests/. So the cross-language crypto gate on the
  # TypeScript side, the one that proves the API and the app agree on the
  # envelope format, was 76 tests that only ever ran on someone's laptop.
  #
  # It is the counterpart of kit-tests below: same vectors, other language.
  # Both must run, or "cross-language" means one language.
  functions-tests:
    name: Cloud Functions tests (crypto + wire parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # tsc before jest: ts-jest would report a type error as a test failure,
      # which reads as a broken assertion rather than a broken build.
      - name: Type-check
        working-directory: functions
        run: npm run build

      - name: jest
        working-directory: functions
        run: npm test

  kit-tests:
    name: PacelliKit tests (crypto vector gate)
    # macos-26 = Xcode 26 / Swift 6 toolchain (April 2026 ASC SDK policy;
    # same pin rationale as release.yml).
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: swift test
        working-directory: PacelliApp/Packages/PacelliKit
        run: swift test

  app-build:
    name: Build PacelliApp (iOS Simulator)
    needs: [kit-tests]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # SPM checkout cache — same key scheme as release.yml (shared restore
      # prefix would cross-pollute signing lanes, so kept per-workflow).
      - name: Cache SPM checkouts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-ci-${{ runner.os }}-${{ hashFiles('PacelliApp/project.yml', 'PacelliApp/Packages/PacelliKit/Package.swift') }}
          restore-keys: |
            spm-ci-${{ runner.os }}-

      - name: Generate project
        working-directory: PacelliApp
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: PacelliApp
        run: |
          xcodebuild -project PacelliApp.xcodeproj \
            -scheme PacelliApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
