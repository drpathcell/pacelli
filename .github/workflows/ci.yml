name: CI/CD

# Flutter tree is FROZEN (native rewrite, 2026-07-07) — these jobs only run
# when Flutter/shared paths change. Native app CI lives in native-ci.yml.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'PacelliApp/**'
      - 'docs/**'
      # functions/ moved to native-ci.yml on 2026-08-14, which is where the
      # jest suite now runs. Without this, a backend-only commit spun up the
      # whole frozen Flutter lane — analyze, test, rules, Android build — and
      # never ran a single functions test, because ci.yml has no job for them.
      # It burned a runner to check nothing.
      - 'functions/**'
      # Same reasoning, finished on 2026-08-23. There is no job in this file
      # that reads scripts/, fastlane/ or any markdown — the two scripts that
      # ARE gated (verify_entitlements, verify_api_wire) are named explicitly in
      # native-ci.yml's `paths`. A screenshot refresh and a change to
      # submit_when_clear.py each ran the whole Flutter lane for 12 minutes and
      # checked nothing about either. firestore.rules is deliberately NOT here:
      # the rules job is real and must keep firing.
      - 'scripts/**'
      - 'fastlane/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'PacelliApp/**'
      - 'docs/**'
      # functions/ moved to native-ci.yml on 2026-08-14, which is where the
      # jest suite now runs. Without this, a backend-only commit spun up the
      # whole frozen Flutter lane — analyze, test, rules, Android build — and
      # never ran a single functions test, because ci.yml has no job for them.
      # It burned a runner to check nothing.
      - 'functions/**'
      # Same reasoning, finished on 2026-08-23. There is no job in this file
      # that reads scripts/, fastlane/ or any markdown — the two scripts that
      # ARE gated (verify_entitlements, verify_api_wire) are named explicitly in
      # native-ci.yml's `paths`. A screenshot refresh and a change to
      # submit_when_clear.py each ran the whole Flutter lane for 12 minutes and
      # checked nothing about either. firestore.rules is deliberately NOT here:
      # the rules job is real and must keep firing.
      - 'scripts/**'
      - 'fastlane/**'
      - '**/*.md'

# Cancel superseded runs on the same branch to avoid stacking long iOS builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  rules-test:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      # Firestore emulator needs a JRE (downloads emulator-vN.N.N.jar then runs it).
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules-test deps
        working-directory: firestore-tests
        run: npm ci

      - name: Run Firestore rules tests
        working-directory: firestore-tests
        run: npm test

  build-android:
    name: Build Android APK
    needs: [analyze, test, rules-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

  build-ios:
    name: Build iOS
    needs: [analyze, test, rules-test]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
