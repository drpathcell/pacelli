name: Release (native)

# Native SwiftUI release lane (rewrite, 2026-07-07). Tag `v1.0.0+N` →
# fastlane native_beta → TestFlight, on the same ASC record as the retired
# Flutter app (builds continue from 26). Flutter lane history: git log.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+\+[0-9]+'
  workflow_dispatch:

# One release at a time, and never kill one in flight.
#
# The build number is chosen by read-then-write in the Fastfile:
# `[floor, latest_testflight + 1].max`. Two runs overlapping both read the
# same latest, both pick the same number, and the loser dies on altool 409
# "buildUpload" — the documented root cause of the v1.0.0+22 failure. The max()
# makes a *sequential* re-tag safe; only serialising makes a concurrent one
# safe.
#
# cancel-in-progress is deliberately false. Cancelling mid-upload is how you
# get a half-delivered build and a burnt build number, and unlike CI there is
# no "a later run covers this commit" argument for a release.
concurrency:
  group: release-native
  cancel-in-progress: false

jobs:
  native-beta:
    name: Native iOS → TestFlight
    # macos-26 = Xcode 26 SDK, required by ASC since April 2026.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Sanity-check iOS secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          : "${ASC_KEY_ID:?ASC_KEY_ID secret is empty}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID secret is empty}"
          : "${ASC_KEY_CONTENT:?ASC_KEY_CONTENT secret is empty}"
          echo "All required iOS secrets are present."

      - name: Load the match deploy key
        env:
          DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          : "${DEPLOY_KEY:?MATCH_DEPLOY_KEY secret is empty}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/match_deploy
          chmod 600 ~/.ssh/match_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/match_deploy
            IdentitiesOnly yes
          EOF
          # Prove the key can actually reach the repo. A silent 403 at push
          # time is what made two signing jobs report success while storing
          # nothing; failing here instead is the whole point.
          GIT_SSH_COMMAND="ssh -i ~/.ssh/match_deploy -o IdentitiesOnly=yes" \
            git ls-remote git@github.com:drpathcell/pacelli-match-certs.git >/dev/null
          echo "Deploy key can read the certs repo."

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # 3.3+, because Gemfile.lock carries excon 1.7.0 (pulled in by the
          # fastlane 2.238.0 bump, 0c7d541) and excon 1.7 requires ruby >= 3.3.
          # Keep this in step with the lock, not with habit.
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      # SPM checkout cache — saves ~4 min of grpc.zip + repo clones per run.
      # Keyed on the dependency pins in project.yml + PacelliKit's manifest
      # (Package.resolved lives inside the gitignored xcodeproj).
      - name: Cache SPM checkouts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ hashFiles('PacelliApp/project.yml', 'PacelliApp/Packages/PacelliKit/Package.swift') }}
          restore-keys: |
            spm-release-${{ runner.os }}-

      # Firebase ships binary SPM targets (grpc.zip from dl.google.com) whose
      # download flakes on runners — pre-resolve with retries so a transient
      # blip doesn't kill the run (v1.0.0+26 first attempt died here).
      # Kept even with the cache: a cache miss still hits dl.google.com.
      - name: Pre-resolve SPM dependencies (retry ×3)
        working-directory: PacelliApp
        run: |
          xcodegen generate
          for i in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project PacelliApp.xcodeproj -scheme PacelliApp; then
              exit 0
            fi
            echo "SPM resolve attempt $i failed; retrying in 20s…"
            sleep 20
          done
          exit 1

      - name: Create build keychain
        env:
          KEY_PWD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEY_PWD" build_keychain
          security default-keychain -s build_keychain
          security unlock-keychain -p "$KEY_PWD" build_keychain
          security set-keychain-settings -lut 21600 build_keychain
          # Add login keychain back to search list so system certs are visible
          security list-keychains -s build_keychain login.keychain

      - name: Run fastlane ios native_beta
        env:
          MATCH_PASSWORD:     ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID:         ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:      ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:    ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_KEYCHAIN_NAME: build_keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane ios native_beta
