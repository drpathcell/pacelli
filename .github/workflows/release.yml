name: Release (native)

# Native SwiftUI release lane (rewrite, 2026-07-07). Tag `v1.0.0+N` →
# fastlane native_beta → TestFlight, on the same ASC record as the retired
# Flutter app (builds continue from 26). Flutter lane history: git log.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+\+[0-9]+'
  workflow_dispatch:

jobs:
  native-beta:
    name: Native iOS → TestFlight
    # macos-26 = Xcode 26 SDK, required by ASC since April 2026.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Sanity-check iOS secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          : "${ASC_KEY_ID:?ASC_KEY_ID secret is empty}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID secret is empty}"
          : "${ASC_KEY_CONTENT:?ASC_KEY_CONTENT secret is empty}"
          : "${MATCH_GIT_URL:?MATCH_GIT_URL secret is empty}"
          echo "All required iOS secrets are present."

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create build keychain
        env:
          KEY_PWD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEY_PWD" build_keychain
          security default-keychain -s build_keychain
          security unlock-keychain -p "$KEY_PWD" build_keychain
          security set-keychain-settings -lut 21600 build_keychain
          # Add login keychain back to search list so system certs are visible
          security list-keychains -s build_keychain login.keychain

      - name: Run fastlane ios native_beta
        env:
          MATCH_GIT_URL:      ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:     ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID:         ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:      ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:    ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_KEYCHAIN_NAME: build_keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane ios native_beta
