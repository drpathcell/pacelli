# XcodeGen spec for the native Pacelli app.
# Regenerate after edits: cd PacelliApp && xcodegen generate
#
# Firebase SPM (FirebaseAuth, FirebaseFirestore) + GoogleSignIn arrive in
# Phase 3 (data layer) — kept out of Phase 1 so the shell builds fast and
# the crypto vector gate stays dependency-free.
name: PacelliApp
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  PacelliKit:
    path: Packages/PacelliKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  PacelliApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/GoogleService-Info.plist
        buildPhase: resources
      - Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: PacelliKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacelli.pacelli
        DEVELOPMENT_TEAM: 5PCNU95W9V
        TARGETED_DEVICE_FAMILY: "1"          # iPhone-only (decision 2026-05-05)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # 1.0 approved & released 2026-08-04 (build 34). 1.1.0 = first
        # update: data export, household rename, generic theme names.
        # 1.1.1 = household invite acceptance fix (rules denied the accept
        # batch; invitees silently landed in a fresh empty household).
        # 1.2.0 = household join codes — SIWA "Hide My Email" users can never
        # be reached by an email-addressed invite, so the household publishes
        # a short bearer code instead.
        # Build numbers stay globally ascending (native floor lives in the
        # Fastfile native_build lane; CI overrides CURRENT_PROJECT_VERSION).
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "35"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Resources/PacelliApp.entitlements   # SIWA
        INFOPLIST_KEY_CFBundleDisplayName: Pacelli    # home-screen name (target is PacelliApp)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # altool 90713: icon is mandatory for upload
        INFOPLIST_FILE: Resources/Info.plist          # explicit CFBundleIconName (merged with generated keys)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # parity with Flutter Info.plist
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Pacelli uses Face ID to protect access to your securely stored encryption keys."
