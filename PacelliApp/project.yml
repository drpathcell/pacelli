# XcodeGen spec for the native Pacelli app.
# Regenerate after edits: cd PacelliApp && xcodegen generate
#
# Firebase SPM (FirebaseAuth, FirebaseFirestore) + GoogleSignIn arrive in
# Phase 3 (data layer) — kept out of Phase 1 so the shell builds fast and
# the crypto vector gate stays dependency-free.
name: PacelliApp
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  PacelliKit:
    path: Packages/PacelliKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  PacelliApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/GoogleService-Info.plist
        buildPhase: resources
      - Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      # Embeds the extension in the app bundle. Without this the target builds
      # and simply never runs.
      - target: PacelliNotificationService
      - package: PacelliKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacelli.pacelli
        DEVELOPMENT_TEAM: 5PCNU95W9V
        TARGETED_DEVICE_FAMILY: "1"          # iPhone-only (decision 2026-05-05)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # CURRENT_PROJECT_VERSION here is NOT the shipped build number and
        # never will be — it is the native lane's FLOOR. Every release build
        # gets max(floor, latest_testflight + 1) computed in the Fastfile
        # native_build lane and passed as an xcarg, so this value only ever
        # applies to local and simulator builds. Keep it equal to the floor in
        # fastlane/Fastfile; native_build asserts the two match and fails loudly
        # if they drift. Do not "update" it to the current build number.
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "35"   # floor, mirrors Fastfile native_build
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Resources/PacelliApp.entitlements   # SIWA
        INFOPLIST_KEY_CFBundleDisplayName: Pacelli    # home-screen name (target is PacelliApp)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # altool 90713: icon is mandatory for upload
        INFOPLIST_FILE: Resources/Info.plist          # explicit CFBundleIconName (merged with generated keys)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # parity with Flutter Info.plist
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Pacelli uses Face ID to unlock the app when you come back to it."   # app lock, NOT keychain gating — see BiometricLock
      configs:
        # aps-environment must match the provisioning profile or signing fails.
        # Debug builds run on the simulator and on development profiles;
        # Release is what CI archives with the App Store profile.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  # Rewrites a push body from "a new task was added" to the real task title,
  # by decrypting `enc_title` on device with the household key. It reads that
  # key through the shared keychain access group, which is the ONLY entitlement
  # it holds — no push, no Sign in with Apple, no Firebase.
  #
  # NOT YET SHIPPABLE: an app extension is a separate bundle id and needs its
  # own App ID and match provisioning profile. Simulator builds need neither,
  # which is why it can be built and proven before that work is done.
  PacelliNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    dependencies:
      - package: PacelliKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacelli.pacelli.NotificationService
        PRODUCT_NAME: PacelliNotificationService
        DEVELOPMENT_TEAM: 5PCNU95W9V
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "35"   # floor — see the app target's note
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NotificationService/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pacelli Notifications
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
