appId: com.pacelli.pacelli
---
# Quantity E2E 1/2 — write an item with a quantity.
#
# Split from the cold read on purpose. Firestore's `setData` resolves against
# the local cache, so killing the app immediately after the await can drop the
# write before it reaches the server — the read half then fails for a reason
# that has nothing to do with encryption. The driver sleeps between the two
# flows to let the write flush, which is the same shape check_lock_e2e.sh uses
# for state that needs real time to settle.
- stopApp
- launchApp
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
- extendedWaitUntil:
    visible: "New task"
    timeout: 45000

- tapOn: "Checklists"
- extendedWaitUntil:
    visible: "New checklist"
    timeout: 15000
- tapOn: "New checklist"
- inputText: "QtyProbe"
- pressKey: Enter
- extendedWaitUntil:
    visible: "QtyProbe"
    timeout: 15000
- hideKeyboard

- tapOn: "QtyProbe"
- extendedWaitUntil:
    visible: "Add an item"
    timeout: 15000

# 347 rather than a realistic "2": a value that appears nowhere else on screen,
# so assertVisible cannot pass on some unrelated digit.
#
# Tap the + button; do NOT press Enter here. The first version of this flow did,
# and it passed while creating nothing: return in the Qty field was swallowed
# (that field had no .onSubmit until 2026-08-14), so the item was never added
# and both assertions below matched the text still sitting in the two input
# fields. Asserting on the contents of a field you just typed into proves only
# that typing works.
#
# The button is the honest target because addItem() clears both fields
# synchronously, so from the moment it fires, any "Peppercorns" on screen is a
# saved row and not an echo of the input.
- tapOn: "Add an item"
- inputText: "Peppercorns"
- tapOn: "Qty"
- inputText: "347"
- hideKeyboard
- tapOn:
    id: "add_item_button"
- extendedWaitUntil:
    visible: "Peppercorns"
    timeout: 15000

# The input fields must be back to their placeholders. If "Add an item" is not
# visible as placeholder text, the row above is still unsaved input.
- assertVisible: "Add an item"
- assertVisible: "347"
- takeScreenshot: /tmp/pv/qty_01_written

# A poke, and not decoration. Everything above is this flow's WORK, and
# flow_qty_02 opens with `stopApp` — so a process that died the instant after
# the write would leave no trace here at all, and the cold read next door would
# find nothing and blame the server or the encryption. That is the shape that
# let build 46's photo crash ship: flow_photo_01 ended at its own success and
# flow_photo_02 killed the corpse.
#
# So: leave the checklist, come back to a screen that has to be rendered from
# scratch, and assert we arrived. It costs three seconds and it is the only
# thing in this flow that can tell a live app from a dead one.
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: "New checklist"
    timeout: 20000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Privacy & encryption"
    timeout: 20000
- assertVisible: "Privacy & encryption"
