appId: com.pacelli.pacelli
---
# NOTE: the burn section at the end REALLY deletes the signed-in account's
# household data. Run it only against a guest/test account.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "My Household"
    timeout: 30000
# Settings tab
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- takeScreenshot: /tmp/pacelli_st_01_settings
# Switch colour scheme → Lavender (menu picker; generic names since 1.1)
- tapOn: "Colours"
- tapOn: "Lavender"
- takeScreenshot: /tmp/pacelli_st_02_lavender_tint
# Privacy & encryption screen
- tapOn: "Privacy & encryption"
- extendedWaitUntil:
    visible: "Encrypted before upload"
    timeout: 15000
- scrollUntilVisible:
    element: "Not encrypted"
    direction: DOWN
- takeScreenshot: /tmp/pacelli_st_03_privacy
# Maestro's `back` edge-swipe is unreliable — SwiftUI back buttons carry
# id "BackButton" (labelled with the previous screen's title).
- tapOn:
    id: "BackButton"
# The burn tail that used to live here is gone. In 1.10.0 "Burn all data" split
# into two operations with different rules — burning the household's shared
# data is the owner's to permit, deleting your own account never is — and one
# flow that pressed one button could not have told them apart. They are
# flow_burn_01_restrict / _02_permit / _03_delete_account, driven by
# check_burn_e2e.sh, which also proves the refusal is the server's.
#
# NEGATIVE-CONTROL: rename the "Privacy & encryption" row and this flow fails
# at the extendedWaitUntil above rather than scrolling past it.
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
