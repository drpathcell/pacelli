appId: com.pacelli.pacelli
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "My Household"
    timeout: 30000
- tapOn: "Buy groceries"
- extendedWaitUntil:
    visible: "Manage categories"
    timeout: 15000
# Assign the category via the picker
- tapOn: "Category"
- extendedWaitUntil:
    visible: "Errands"
    timeout: 15000
- tapOn: "Errands"
- extendedWaitUntil:
    visible: "Manage categories"
    timeout: 15000
- takeScreenshot: /tmp/pacelli_e2e_14_category_assigned
- tapOn: "Save"
- back
- extendedWaitUntil:
    visible: "My Household"
    timeout: 15000
- takeScreenshot: /tmp/pacelli_e2e_15_home_badges
# Swipe-to-delete check on a throwaway task
- tapOn: "New task"
- inputText: "Throwaway"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Throwaway"
    timeout: 15000
- hideKeyboard
- swipe:
    from: "Throwaway"
    direction: LEFT
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Throwaway"
    timeout: 15000
- takeScreenshot: /tmp/pacelli_e2e_16_after_delete
