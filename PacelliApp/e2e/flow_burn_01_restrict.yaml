appId: com.pacelli.pacelli
---
# NEGATIVE-CONTROL: revert BurnDataView to a single unconditional "Burn all
# data" button and this flow fails at `burnNotPermitted`, which does not exist
# in that build. Driven by check_burn_e2e.sh, which then proves the refusal is
# the SERVER's and not this screen's.
#
# Path 1 of 3: the owner switches the policy to Nobody, and the burn action
# disappears for them too. What this does NOT prove is that a restricted caller
# is actually stopped — a hidden button stops nobody who is not using the app.
# That is check_burn_e2e.sh's job, immediately after this flow.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "My Household"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- scrollUntilVisible:
    element: "Delete data"
    direction: DOWN
- tapOn: "Delete data"
- extendedWaitUntil:
    visible: "Household data"
    timeout: 15000
# The policy is fetched from the server, so the screen may still be checking.
- extendedWaitUntil:
    visible:
      id: "burnPermissionLink"
    timeout: 20000
- tapOn:
    id: "burnPermissionLink"
- extendedWaitUntil:
    visible: "Who can erase shared data"
    timeout: 15000
- tapOn:
    id: "burnPermission_nobody"
- tapOn:
    id: "burnPermissionSave"
# Back on the burn screen, the button must be GONE and replaced by the reason.
- extendedWaitUntil:
    visible:
      id: "burnNotPermitted"
    timeout: 20000
- assertNotVisible:
    id: "burnHouseholdButton"
# Account deletion is NOT gated and must still be offered — the 5.1.1(v)
# promise, checked on the screen where breaking it would be easiest.
- assertVisible:
    id: "deleteAccountButton"
- takeScreenshot: /tmp/pacelli_burn_01_restricted
