appId: com.pacelli.pacelli
---
# Quantity E2E 2/2 — the same item, read back cold.
#
# This is the half that proves anything. Everything in flow 1 could be served
# from memory by an app that never encrypted on write or never decrypted on
# read; only a fresh process reading Firestore exercises both directions.
#
# No "Continue as guest" branch here by design: the session persists in the
# keychain, and if the welcome screen appeared it would mean this flow is
# looking at a different household than the one flow 1 wrote to — which would
# make a pass meaningless.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "New task"
    timeout: 45000
- tapOn: "Checklists"
- extendedWaitUntil:
    visible: "QtyProbe"
    timeout: 20000
- tapOn: "QtyProbe"
- extendedWaitUntil:
    visible: "Peppercorns"
    timeout: 20000
- assertVisible: "347"
- takeScreenshot: /tmp/pv/qty_02_after_cold_read

# Deliberately NO cleanup here. Two reasons:
#
#   - the driver erases the simulator before every run, so there is nothing
#     left to tidy; the old delete was solving a problem that the erase already
#     solves properly (an uninstall alone left the keychain, and with it the
#     guest account and its accumulated households)
#   - step 4/4 inspects the stored document to prove it holds ciphertext.
#     Deleting the checklist here removes exactly that evidence, and the
#     at-rest check would then pass on an empty database — which is the failure
#     mode it exists to refuse.
